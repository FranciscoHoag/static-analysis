homepage: "https://nestjs.doctor"
description: >-
  Free, open-source static analysis for NestJS. Reads the module graph from
  source without booting the app, runs rules across security, correctness,
  architecture, performance and schema, and scores the project 0-100. HTML
  report with the module graph, circular imports, traced endpoints and an ER
  diagram (Prisma, TypeORM, Drizzle, MikroORM). No LLM at scan time; nothing
  about your code leaves the machine. CLI, GitHub Action that comments only on
  what a pull request introduced, VS Code extension.
